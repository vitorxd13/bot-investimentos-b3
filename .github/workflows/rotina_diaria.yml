name: Rotina Diária de Atualização B3

on:
  schedule:
    # Roda de segunda a sexta às 21:00 UTC (18:00 Horário de Brasília, após o fechamento da B3)
    - cron: '0 21 * * 1-5'
  workflow_dispatch: # Permite rodar manualmente clicando em um botão a qualquer momento

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install gspread pandas pyfundamentus

      - name: Executar Atualização da Planilha
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: python atualizar_planilha.py
